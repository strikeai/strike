[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strike-ai"
version = "0.1.0"
description = "Client for the Strike API: typed yes/no, choice, and score decisions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Strike", email = "hello@strike-ai.eu" }]
dependencies = ["httpx>=0.25"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
keywords = ["strike", "decisions"]

[project.urls]
Homepage = "https://strike-ai.eu"
Documentation = "https://strike-ai.eu/docs"
Repository = "https://github.com/strikeai/strike"

[tool.hatch.build.targets.wheel]
packages = ["strike_ai"]
